name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RemoteControl
          --add-data "remote_control/static;remote_control/static"
          --hidden-import PIL.ImageTk
          run_app.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process dist\RemoteControl.exe -ArgumentList "--selftest","selftest.txt" -PassThru -Wait
          $r = Get-Content selftest.txt
          Write-Host "selftest: $r (exit $($p.ExitCode))"
          if ($r -ne "OK") { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-windows
          path: dist/RemoteControl.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemoteControl.exe
